spring:

  # ==========================================================
  # Application Information
  # ==========================================================
  application:
    name: employee-management-system


  # ==========================================================
  # MySQL Database Configuration
  # ==========================================================
  datasource:

    # Local default:
    # jdbc:mysql://localhost:3306/employee_management_db
    #
    # Docker overrides this using SPRING_DATASOURCE_URL.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

    # Local default database credentials.
    #
    # Docker overrides these values through environment variables.
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:your_mysql_password}

    driver-class-name: com.mysql.cj.jdbc.Driver


  # ==========================================================
  # Spring Data JPA and Hibernate
  # ==========================================================
  jpa:

    hibernate:
      # Suitable for project development.
      #
      # Hibernate creates or updates tables from entity classes.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

    # Display generated SQL in the application console
    show-sql: true

    # Prevent database queries from remaining open
    # until the controller finishes.
    open-in-view: false

    properties:
      hibernate:
        # Format generated SQL for easier reading
        format_sql: true


# ============================================================
# Embedded Server
# ============================================================
server:
  port: 8080


# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc:

  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha


# ============================================================
# Application Security
# ============================================================
application:

  security:

    jwt:

      # Docker overrides this through:
      # APPLICATION_SECURITY_JWT_SECRET_KEY
      #
      # This fallback is for local development only.
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWYxMjM0NTY=}

      # Default: 24 hours in milliseconds
      access-token-expiration: ${APPLICATION_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION:86400000}


# ============================================================
# Logging
# ============================================================
logging:

  level:
    root: INFO
    com.project.ems: INFO