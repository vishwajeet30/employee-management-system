spring:

  datasource:
      url: jdbc:mysql://localhost:3306/employee_management_db
      username: root
      password: root
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
      port: 8080
      
springdoc:

  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

