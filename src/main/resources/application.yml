spring:
  application:
    name: employee-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/employee_management_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

application:
  security:
    jwt:

      # Base64-encoded secret used for signing access tokens.
      # Replace this with an environment variable before deployment.
      secret-key: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXphYmNkZWYxMjM0NTY=

      # Access-token lifetime in milliseconds.
      # 86400000 milliseconds = 24 hours.
      access-token-expiration: 86400000

logging:
  level:
    org.springframework.security: TRACE
    com.project.ems.security: DEBUG
